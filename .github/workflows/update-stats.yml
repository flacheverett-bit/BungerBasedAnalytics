name: Update hero stats and patches (daily)

on:
  schedule:
    - cron: "30 6 * * *"     # daily at 06:30 UTC, after the previous UTC day is complete
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Each game's steps can fail independently (e.g. a source site is down)
      # without blocking the other game's data from being committed.
      - name: Deadlock - hero stats
        continue-on-error: true
        run: python pipeline/deadlock_heroes.py
      - name: Deadlock - matchups, builds and core items
        continue-on-error: true
        run: python pipeline/deadlock_meta.py
      - name: Overwatch - hero win/pick/ban snapshot (Blizzard)
        continue-on-error: true
        run: python pipeline/overwatch_heroes.py
      - name: Overwatch - perks and pro pick shares
        continue-on-error: true
        run: python pipeline/overwatch_perks.py
      - name: Marvel Rivals - hero win/pick/ban snapshot
        continue-on-error: true
        run: python pipeline/marvel_rivals_heroes.py
      - name: Marvel Rivals - team-up loadout usage
        continue-on-error: true
        run: python pipeline/marvel_rivals_teamups.py
      - name: Rebuild patch markers
        continue-on-error: true
        run: python pipeline/patches.py deadlock overwatch marvel-rivals
      - name: Deadlock - patch impact analysis (pandas)
        continue-on-error: true
        run: |
          pip install --quiet pandas numpy
          python pipeline/patch_impact.py
      - name: Meta health score (all games)
        continue-on-error: true
        run: |
          pip install --quiet pandas numpy
          python pipeline/meta_health.py
      - name: SQL warehouse (DuckDB) + run the SQL analyses
        continue-on-error: true
        run: |
          pip install --quiet pandas duckdb
          python pipeline/build_warehouse.py
          python pipeline/run_sql.py
      - name: Validate all data (invariant checks -> data/data_health.json)
        continue-on-error: true    # a failing check is reported on the site, not allowed to block the update
        run: python pipeline/validate_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: daily hero stats update"
          git pull --rebase
          git push
